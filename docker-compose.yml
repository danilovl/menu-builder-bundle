services:
  php:
    build:
      context: ./
      dockerfile: ./docker/php/Dockerfile
    expose:
      - '9000'
    volumes:
      - "./:/var/www/html/app"
    working_dir: /var/www/html/app
    env_file:
      - .env

  node:
    build:
      context: ./
      dockerfile: ./docker/node/Dockerfile
    volumes:
      - './:/app'
      - '/app/node_modules'
    working_dir: /app
